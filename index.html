<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ratios financiers</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mute:#5d6b7c;--line:#dde3ea;--pri:#1f4e79;--pri2:#2f6ea8;--head:#1f4e79;--btn:#1f4e79;--hover:#eef3f8;--code:#eef2f6;--field:#fbfcfd;--onbadge:#fff;
--ok:#1e8a4c;--okbg:#e5f5ec;--okline:#bfe3cd;--warn:#b86e00;--warnbg:#fff3df;--warnline:#f2d6a6;--bad:#c0392b;--badbg:#fdecea;--badline:#f1c2bc;--info:#2f6ea8;--infobg:#e8f1fa;--infoline:#c5dbef}
:root[data-theme=dark]{--bg:#0f1720;--card:#18222d;--ink:#e6edf3;--mute:#9aa8b6;--line:#2a3846;--pri:#8cbcf0;--pri2:#5a9ad8;--head:#15304b;--btn:#2f6ea8;--hover:#1f2c39;--code:#202d3a;--field:#111a23;--onbadge:#0b1118;
--ok:#3fbf73;--okbg:#13291d;--okline:#24543a;--warn:#e0a03c;--warnbg:#2d2210;--warnline:#5c4420;--bad:#ef6b5c;--badbg:#2e1615;--badline:#5e2a26;--info:#6aa8e6;--infobg:#132536;--infoline:#24476a;color-scheme:dark}
@media print{:root[data-theme=dark]{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mute:#5d6b7c;--line:#dde3ea;--pri:#1f4e79;--pri2:#2f6ea8;--head:#1f4e79;--btn:#1f4e79;--hover:#eef3f8;--code:#eef2f6;--field:#fbfcfd;--onbadge:#fff;
--ok:#1e8a4c;--okbg:#e5f5ec;--okline:#bfe3cd;--warn:#b86e00;--warnbg:#fff3df;--warnline:#f2d6a6;--bad:#c0392b;--badbg:#fdecea;--badline:#f1c2bc;--info:#2f6ea8;--infobg:#e8f1fa;--infoline:#c5dbef;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--head);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:600;flex:1;line-height:1.25}
#back{background:none;border:0;color:#fff;font-size:24px;padding:0 6px 0 0;display:none}
main{padding:14px 14px 40px;max-width:720px;margin:0 auto}
.cat{margin:6px 0 18px}
.cat h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);margin:0 0 2px}
.cat p.sub{margin:0 0 8px;color:var(--mute);font-size:13.5px}
.item{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item:active{background:var(--hover)}
.item .t{flex:1}
.item b{display:block;font-weight:600}
.item small{color:var(--mute);font-size:13px}
.item .chev{color:var(--mute);font-size:22px;margin-left:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.formula{font-family:ui-monospace,monospace;background:var(--code);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0}
.desc{color:var(--mute);font-size:14px;margin:0}
label{display:block;font-weight:600;font-size:14.5px;margin:12px 0 4px}
label small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
input{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
input:focus{outline:2px solid var(--pri2);border-color:transparent}
.btns{display:flex;gap:10px;margin-top:16px}
button.main{flex:1;background:var(--btn);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600}
button.sec{background:var(--card);color:var(--pri);border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-size:15px}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.res{border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid}
.res.ok{background:var(--okbg);border-color:var(--okline)}.res.warn{background:var(--warnbg);border-color:var(--warnline)}
.res.bad{background:var(--badbg);border-color:var(--badline)}.res.info{background:var(--infobg);border-color:var(--infoline)}
.val{font-size:32px;font-weight:700;margin:2px 0}
.badge{display:inline-block;border-radius:20px;padding:3px 11px;font-size:13px;font-weight:700;color:var(--onbadge)}
.ok .badge{background:var(--ok)}.warn .badge{background:var(--warn)}.bad .badge{background:var(--bad)}.info .badge{background:var(--info)}
.res p{margin:10px 0 0}
.calc{font-family:ui-monospace,monospace;font-size:13px;color:var(--mute);margin-top:10px;word-break:break-word}
.scale{font-size:13px;color:var(--mute)}
.scale div{display:flex;align-items:center;gap:8px;margin:3px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.foot{color:var(--mute);font-size:12.5px;text-align:center;margin-top:10px}
.hero{background:linear-gradient(135deg,#1f4e79,#2f6ea8);color:#fff;border-radius:14px;padding:16px;margin:4px 0 20px;cursor:pointer}
.hero b{font-size:18px;display:block}.hero small{opacity:.9;font-size:13.5px;display:block;margin-top:4px}
.hero .go{display:inline-block;margin-top:10px;background:#fff;color:#1f4e79;border-radius:8px;padding:7px 12px;font-weight:700;font-size:14px}
select{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
.opt{font-weight:400;color:var(--mute);font-size:12px}
h3{font-size:15px;color:var(--pri);margin:4px 0 4px}
.sec-t{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);margin:18px 0 6px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .ph{font-size:11.5px;color:var(--mute);margin:0 0 2px 2px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;margin:6px 0}
.chk input{width:22px;height:22px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600}
td.n{white-space:nowrap}
.tw{overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kpi div{border-radius:10px;padding:9px 8px;text-align:center;border:1px solid var(--line)}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mute)}
.lst{margin:6px 0 0;padding-left:18px}.lst li{margin:4px 0;font-size:14px}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.mini{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
details.thbox{padding:0}
details.thbox summary{padding:13px 14px;font-weight:700;color:var(--pri);cursor:pointer;list-style:none}
details.thbox summary::before{content:"📘  ";}
details.thbox summary::after{content:"▾";float:right;color:var(--mute)}
details.thbox[open] summary::after{content:"▴"}
details.thbox .th{padding:0 14px 12px;border-top:1px solid var(--line)}
.th h4{font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--pri);margin:14px 0 4px}
.th p,.th li{font-size:14.5px;margin:4px 0}
.th ol{padding-left:20px;margin:4px 0}
.thlink{border-color:var(--infoline);background:var(--infobg);margin-bottom:18px}
.lock{text-align:center;margin-top:30px}.lock .lockico{font-size:44px}.lock input{text-align:center;font-size:22px;letter-spacing:.3em}.lock .desc{margin:8px 0 14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}.seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:11px 4px;font-size:14.5px}.seg button.on{background:var(--btn);color:#fff;font-weight:700}
.appear{margin-top:16px}.appear b{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
@media print{header,.btns,.noprint,button,details.thbox{display:none!important}body{background:#fff}.card,.res{break-inside:avoid;border-color:#ccc}main{padding:0}}
#gate{position:fixed;inset:0;z-index:9999;background:#1f4e79;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{max-width:360px;width:100%;text-align:center;color:#fff}
.gbox img{border-radius:22px}
.gbox h2{margin:10px 0 4px}
.gbox input[type=password],.gbox input[type=text]{width:100%;padding:12px;border:1px solid #dde3ea;border-radius:10px;font-size:1.05rem;background:#fff;color:#1c2430;text-align:center;box-sizing:border-box}
.gl{display:block;margin:8px 0;font-size:.85rem;color:#dde3ea}
.ge{color:#ffb4a9;min-height:1.4em}
.gbox .btn{margin-top:6px;padding:12px 22px;border:0;border-radius:10px;background:#fff;color:#1f4e79;font-size:1rem;font-weight:600}
</style>
</head>

<script>
/* Déverrouillage : le contenu de l'application est chiffré (AES-GCM, clé dérivée par PBKDF2). */
(function(){
var SALT_B64='luTwwym4ywrrW/Qv3m1ihw==',ITER=600000,K='rf_key';
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function tob64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function run(key){
  var p=b64(window.ENC);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:p.slice(0,12)},key,p.slice(12)).then(function(b){
    var src=dec.decode(b);window.ENC=null;(0,eval)(src);
  });
}
function fail(msg){
  var d=document.createElement('div');d.id='gate';
  d.innerHTML='<div class="gbox"><h2>Application indisponible</h2><p>'+msg+'</p></div>';
  document.body.appendChild(d);
}
if(!(window.crypto&&crypto.subtle)){fail('Ce navigateur ne permet pas le déverrouillage (connexion sécurisée https requise).');return}
if(!window.ENC){fail('Contenu introuvable. Vérifiez la connexion et rechargez la page.');return}
function gate(){
  var g=document.createElement('div');g.id='gate';
  g.innerHTML='<div class="gbox"><img src="icon-192.png" alt="Logo" width="96" height="96"><h2>Accès protégé</h2><p>Saisissez le code d\'accès pour ouvrir l\'application.</p><input type="password" id="gc" autocomplete="off" autocapitalize="off" placeholder="Code d\'accès"><label class="gl"><input type="checkbox" id="gs"> Afficher le code</label><button class="btn" id="gb">Ouvrir</button><p id="ge" class="ge"></p></div>';
  document.body.appendChild(g);
  var busy=false;
  function check(){
    if(busy)return;
    var v=norm(document.getElementById('gc').value);
    if(!v)return;
    busy=true;
    var e=document.getElementById('ge'),b=document.getElementById('gb');
    e.textContent='Vérification…';b.disabled=true;
    crypto.subtle.importKey('raw',enc.encode(v),'PBKDF2',false,['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT_B64),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
    }).then(function(key){
      var p=b64(window.ENC);
      return crypto.subtle.decrypt({name:'AES-GCM',iv:p.slice(0,12)},key,p.slice(12)).then(function(buf){
        return crypto.subtle.exportKey('raw',key).then(function(raw){
          try{localStorage.setItem(K,tob64(raw))}catch(x){}
          g.parentNode.removeChild(g);
          var src=dec.decode(buf);window.ENC=null;(0,eval)(src);
        });
      });
    }).catch(function(){
      busy=false;b.disabled=false;
      e.textContent='Code incorrect.';
      document.getElementById('gc').value='';
    });
  }
  document.getElementById('gb').onclick=check;
  document.getElementById('gc').onkeydown=function(ev){if(ev.key==='Enter')check()};
  document.getElementById('gs').onchange=function(){document.getElementById('gc').type=this.checked?'text':'password'};
}
var stored=null;try{stored=localStorage.getItem(K)}catch(x){}
if(stored){
  crypto.subtle.importKey('raw',b64(stored),{name:'AES-GCM'},true,['decrypt']).then(run).catch(function(){try{localStorage.removeItem(K)}catch(x){}gate()});
}else{gate()}
})();

</script>
